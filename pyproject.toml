[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candetect"
version = "0.1.0"
description = "Dead plate detection demo for Anaconda AI Orchestration"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "pillow",
    "torch",
    "torchvision",
    "safetensors",
    "onnx",
    "onnxscript",
    "onnxruntime",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "flows", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
