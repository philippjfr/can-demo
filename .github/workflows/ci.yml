name: ci

# Pull requests: lint and test, then deploy a branch copy of the project next to production,
# train on it with the PR's code, and compare the result with the production model.
# With a single perimeter, project branches stand in for separate experimentation and production
# perimeters: this workflow writes to the branch `test.<git branch>`, deploy.yml to `main`.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  # obproject-deploy reads the branch name from these.
  GH_HEAD_REF: ${{ github.head_ref }}
  GH_REF: ${{ github.ref_name }}
  CANDETECT_CONDA_CHANNELS: ${{ vars.CANDETECT_CONDA_CHANNELS }}
  CANDETECT_REGISTRY: ${{ vars.CANDETECT_REGISTRY }}
  CANDETECT_BASE_IMAGE: ${{ vars.CANDETECT_BASE_IMAGE }}

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ruff check src tests flows scripts deployments edge manual_tests
      - run: pytest -q

  deploy-branch:
    needs: test
    timeout-minutes: 45
    # Fork PRs get no OIDC token, so they run tests only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # OB_MACHINE_USER_PR is a machine user restricted to the `ci` workflow of this repository.
      - name: Authenticate to the platform with the GitHub OIDC token
        run: |
          outerbounds service-principal-configure \
            --name "${{ vars.OB_MACHINE_USER_PR }}" \
            --deployment-domain "${{ vars.OB_DEPLOYMENT_DOMAIN }}" \
            --perimeter "${{ vars.OB_PERIMETER_EXPERIMENT || 'default' }}" \
            --github-actions

      # Flows only: the dashboard deploys from main (deployments/monitor/obproject_deploy.toml).
      - name: Deploy the branch copy
        run: obproject-deploy --skip-apps --skip-assets

      # Trains with this PR's code on the branch copy, waits, then compares with production.
      - name: Train on the branch copy and compare with production
        run: python scripts/pr_report.py --out build/pr-report

      - name: Attach the model cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-cards
          path: build/pr-report
          if-no-files-found: ignore

      - name: Comment the comparison on the pull request
        if: always() && hashFiles('build/pr-report/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.number }}" \
            --body-file build/pr-report/report.md --edit-last --create-if-none

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - name: Authenticate to the platform with the GitHub OIDC token
        run: |
          outerbounds service-principal-configure \
            --name "${{ vars.OB_MACHINE_USER_PR }}" \
            --deployment-domain "${{ vars.OB_DEPLOYMENT_DOMAIN }}" \
            --perimeter "${{ vars.OB_PERIMETER_EXPERIMENT || 'default' }}" \
            --github-actions
      - name: Tear down the branch copy
        run: |
          project=$(python -c "import tomllib; print(tomllib.load(open('obproject.toml','rb'))['project'])")
          branch=$(python -c "from candetect.config import project_branch; print(project_branch('${GH_HEAD_REF}'))")
          outerbounds flowproject teardown-branch --id "$project/$branch" --yes
