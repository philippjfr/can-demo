name: build-image

# FALLBACK. The platform's image baking (Fast Bakery) installs dependencies only; it cannot add a
# model file or custom labels, and its images live in the platform registry. So the edge image is
# built here. scripts/promote.py starts this workflow with `gh workflow run` after tagging a run
# `production`, and BuildEdgeImageFlow records on the platform what this build must match.
on:
  workflow_dispatch:
    inputs:
      pathspec:
        description: Promoted run, for example TrainCanDetectorFlow/73007
        required: true
      model_version:
        description: Model version recorded on the run
        required: true
      dataset_hash:
        description: Dataset sha256 recorded on the run
        required: true
      base_image:
        description: Base image for the edge image
        default: python:3.12-slim-bookworm

permissions:
  contents: read
  packages: write
  id-token: write # GitHub OIDC token, exchanged for platform access by the machine user

concurrency:
  group: build-image-${{ inputs.pathspec }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PATHSPEC: ${{ inputs.pathspec }}
      MODEL_VERSION: ${{ inputs.model_version }}
      DATASET_HASH: ${{ inputs.dataset_hash }}
      BASE_IMAGE: ${{ inputs.base_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Machine user named in OB_MACHINE_USER_MAIN must be restricted to this repository's main branch.
      - name: Authenticate to the platform with the GitHub OIDC token
        run: |
          outerbounds service-principal-configure \
            --name "${{ vars.OB_MACHINE_USER_MAIN }}" \
            --deployment-domain "${{ vars.OB_DEPLOYMENT_DOMAIN }}" \
            --perimeter "${{ vars.OB_PERIMETER_PROD || 'default' }}" \
            --github-actions

      - name: Fetch the promoted model
        run: |
          python -m candetect.publish fetch "$PATHSPEC" build --expect-hash "$DATASET_HASH"
          cp edge/serve.py build/serve.py

      - name: Work out the image reference
        id: ref
        run: |
          tag=$(python -c "import json; print(json.load(open('build/metadata.json'))['image_tag'])")
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          registry="${{ vars.CANDETECT_REGISTRY }}"
          echo "image=${registry:-ghcr.io/$owner}/can-detection-edge:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: build
          file: edge/Dockerfile
          load: true
          tags: ${{ steps.ref.outputs.image }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            RUN_ID=${{ inputs.pathspec }}
            MODEL_VERSION=${{ inputs.model_version }}
            DATASET_HASH=${{ inputs.dataset_hash }}

      - name: Check labels and run a prediction in the image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          label() { docker inspect --format "{{ index .Config.Labels \"$1\" }}" "$IMAGE"; }
          test "$(label com.candetect.run-id)" = "$PATHSPEC"
          test "$(label com.candetect.model-version)" = "$MODEL_VERSION"
          test "$(label com.candetect.dataset-hash)" = "$DATASET_HASH"
          python - <<'EOF'
          from PIL import Image
          from candetect.data import DataConfig, generate_dataset
          Image.fromarray(generate_dataset(DataConfig(n_images=2)).images[0]).save("build/sample.png")
          EOF
          docker run --rm "$IMAGE" info
          docker run --rm -v "$PWD/build:/in:ro" "$IMAGE" predict /in/sample.png

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: docker push "$IMAGE"

      - name: Record the image on the model run
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: python -m candetect.publish tag-image "$PATHSPEC" "$IMAGE"

      - name: Summary
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          {
            echo "### Edge image"
            echo "- image: \`$IMAGE\`"
            echo "- run: \`$PATHSPEC\`"
            echo "- model version: \`$MODEL_VERSION\`"
            echo "- dataset hash: \`$DATASET_HASH\`"
            echo "- base image: \`$BASE_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
