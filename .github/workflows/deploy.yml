name: deploy

# Merges to main deploy the production project with obproject-deploy: flows (Metaflow branch
# `prod`, shown as `main` in the project UI) and the dashboard app.
# Only the machine user in OB_MACHINE_USER_MAIN may deploy production: the first production deploy
# of a flow issues a production token, and any other user needs it passed with --authorize.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GH_REF: ${{ github.ref_name }}
  CANDETECT_CONDA_CHANNELS: ${{ vars.CANDETECT_CONDA_CHANNELS }}
  CANDETECT_REGISTRY: ${{ vars.CANDETECT_REGISTRY }}
  CANDETECT_BASE_IMAGE: ${{ vars.CANDETECT_BASE_IMAGE }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ruff check src tests flows scripts deployments edge manual_tests
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Authenticate to the platform with the GitHub OIDC token
        run: |
          outerbounds service-principal-configure \
            --name "${{ vars.OB_MACHINE_USER_MAIN }}" \
            --deployment-domain "${{ vars.OB_DEPLOYMENT_DOMAIN }}" \
            --perimeter "${{ vars.OB_PERIMETER_PROD || 'default' }}" \
            --github-actions

      - name: Deploy the project
        run: obproject-deploy
